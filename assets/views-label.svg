<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 44" width="300" height="44" role="img" aria-label="You are visitor">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect x="2" y="2" width="296" height="40" rx="20"/></clipPath>
  </defs>

  <rect x="2" y="2" width="296" height="40" rx="20" fill="#0d1117" stroke="url(#bd)" stroke-width="2"/>

  <g clip-path="url(#cp)">
    <rect width="60" height="44" fill="url(#sh)" transform="skewX(-20)">
      <animate attributeName="x" values="-100;380" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing ring around the eye -->
  <circle cx="32" cy="22" r="14" fill="none" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="r" values="14;22" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- eye that looks around and blinks -->
  <ellipse cx="32" cy="22" rx="13" ry="9" fill="#fff" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="ry" values="9;9;9;1;9;9" keyTimes="0;0.4;0.7;0.75;0.8;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="32" cy="22" r="4.5" fill="#0d1117">
    <animate attributeName="cx" values="27;37;32;32;27" keyTimes="0;0.25;0.5;0.8;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="27" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#e6edf3">YOU ARE VISITOR</text>

  <!-- arrow nudging toward the counter -->
  <text x="268" y="28" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#38bdf8">➜
    <animate attributeName="x" values="264;274;264" dur="1.3s" repeatCount="indefinite"/>
  </text>
</svg>
